name: Nightly quality

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "pytest-randomly seed used to reproduce a previous failure"
        required: false
        type: string

permissions:
  contents: read

jobs:
  randomized-tests:
    name: Randomized pytest order
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      INCIDENTRELAY_CONFIG_FILE: ${{ github.workspace }}/tests/incidentrelay.test.conf
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-randomly==4.1.0

      - name: Prepare test directories
        run: |
          mkdir -p tests/.tmp logs

      - name: Run migrations
        run: python manage.py migrate

      - name: Check database schema
        run: python -m app.check_schema

      - name: Check templates
        run: python -m app.check_templates

      - name: Run tests in randomized order
        shell: bash
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_SEED:-}" ]]; then
            echo "Reproducing pytest-randomly seed: $REQUESTED_SEED"
            pytest --randomly-seed="$REQUESTED_SEED"
          else
            pytest
          fi

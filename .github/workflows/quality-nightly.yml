name: Nightly quality

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "pytest-randomly seed used to reproduce a previous failure"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deep-static-analysis:
    name: Deep static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      INCIDENTRELAY_CONFIG_FILE: ${{ github.workspace }}/tests/incidentrelay.test.conf
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-quality.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r requirements-quality.txt

      - name: Full Ruff scan
        run: |
          ruff check \
            --output-format=github \
            app tests manage.py run.py

      - name: Full Bandit scan
        run: |
          bandit \
            -q \
            -r app \
            -ll \
            -ii

      - name: Mypy legacy audit
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy app \
            --ignore-missing-imports \
            --check-untyped-defs \
            --show-error-codes \
            --no-error-summary \
            2>&1 | tee mypy-report.txt

      - name: Vulture dead-code audit
        id: vulture
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          vulture app \
            --min-confidence 80 \
            2>&1 | tee vulture-report.txt

      - name: Summarize advisory findings
        if: always()
        shell: bash
        run: |
          {
            echo "## Deep static analysis"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| mypy | ${{ steps.mypy.outcome }} |"
            echo "| Vulture | ${{ steps.vulture.outcome }} |"
            echo
            echo "mypy and Vulture are advisory during the initial legacy audit."
            echo "Ruff and Bandit remain blocking."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deep-static-analysis-reports
          path: |
            mypy-report.txt
            vulture-report.txt
          if-no-files-found: ignore
          retention-days: 14

  randomized-tests:
    name: Randomized pytest order
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      INCIDENTRELAY_CONFIG_FILE: ${{ github.workspace }}/tests/incidentrelay.test.conf
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-quality.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r requirements-quality.txt

      - name: Prepare test directories
        run: |
          mkdir -p tests/.tmp logs

      - name: Run migrations
        run: python manage.py migrate

      - name: Check database schema
        run: python -m app.check_schema

      - name: Check templates
        run: python -m app.check_templates

      - name: Run tests in randomized order
        shell: bash
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail

          if [[ -n "${REQUESTED_SEED:-}" ]]; then
            echo "Reproducing pytest-randomly seed: $REQUESTED_SEED"
            pytest --randomly-seed="$REQUESTED_SEED"
          else
            pytest
          fi

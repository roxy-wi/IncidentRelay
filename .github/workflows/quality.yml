name: Quality

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run actionlint and ShellCheck
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 \
            -color

  changed-code-quality:
    name: Changed code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      INCIDENTRELAY_CONFIG_FILE: ${{ github.workspace }}/tests/incidentrelay.test.conf
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Determine comparison base
        id: comparison
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          base="${EVENT_BASE_SHA:-}"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ -z "$base" || "$base" == "$zero_sha" ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "Comparison base $base is unavailable" >&2
            exit 1
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "Comparing $base..HEAD"

      - name: Ruff changed Python files
        shell: bash
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$BASE_SHA" HEAD -- '*.py'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed Python files."
            exit 0
          fi

          printf 'Ruff checking %s\n' "${files[@]}"
          ruff check --output-format=github "${files[@]}"

      - name: Bandit changed application Python files
        shell: bash
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
        run: |
          set -euo pipefail

          mapfile -d '' changed < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$BASE_SHA" HEAD -- '*.py'
          )

          files=()
          for file in "${changed[@]}"; do
            if [[ "$file" == app/* ]]; then
              files+=("$file")
            fi
          done

          if (( ${#files[@]} == 0 )); then
            echo "No changed application Python files."
            exit 0
          fi

          printf 'Bandit checking %s\n' "${files[@]}"
          bandit -q -ll -ii "${files[@]}"

      - name: Check changed JavaScript syntax
        shell: bash
        env:
          BASE_SHA: ${{ steps.comparison.outputs.base }}
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git diff --name-only --diff-filter=ACMR -z \
              "$BASE_SHA" HEAD -- '*.js'
          )

          if (( ${#files[@]} == 0 )); then
            echo "No changed JavaScript files."
            exit 0
          fi

          node --version
          for file in "${files[@]}"; do
            echo "Checking $file"
            node --check "$file"
          done

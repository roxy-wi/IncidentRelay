name: Quality

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:
    branches:
      - main
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run actionlint and ShellCheck
        run: |
          docker run --rm \
            -v "${PWD}:/repo" \
            --workdir /repo \
            rhysd/actionlint:1.7.12 \
            -color

  full-code-quality:
    name: Full code quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      INCIDENTRELAY_CONFIG_FILE: ${{ github.workspace }}/tests/incidentrelay.test.conf
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-quality.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -r requirements.txt \
            -r requirements-dev.txt \
            -r requirements-quality.txt

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Ruff full Python codebase
        run: |
          ruff check \
            --output-format=github \
            app tests manage.py run.py

      - name: Bandit full application codebase
        run: |
          bandit \
            -q \
            -r app \
            -ll \
            -ii

      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          count=0

          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
            count=$((count + 1))
          done < <(find app/static/js -type f -name '*.js' -print0)

          echo "Checked $count JavaScript files."

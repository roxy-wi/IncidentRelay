name: Docker image and Helm chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: roxy-wi/incidentrelay
  CHART_DIR: helm/incidentrelay
  CHART_REGISTRY: ghcr.io/roxy-wi/incidentrelay-charts

jobs:
  helm-check:
    name: Helm ${{ matrix.helm-version }} validation
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.21.3
          - v4.2.3

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ matrix.helm-version }}

      - name: Lint chart
        run: |
          helm lint "${CHART_DIR}" \
            --set-string config.main.secret_key=incidentrelay-ci-secret

      - name: Render chart
        run: |
          helm template incidentrelay "${CHART_DIR}" \
            --namespace incidentrelay \
            --set-string config.main.secret_key=incidentrelay-ci-secret \
            > /tmp/incidentrelay.yaml
          test -s /tmp/incidentrelay.yaml

  build-and-push:
    name: Build and push Docker image
    needs: helm-check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: image
        shell: bash
        run: |
          image="${REGISTRY}/${IMAGE_NAME}"
          short_sha="${GITHUB_SHA::12}"

          {
            echo "tags<<EOF"

            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              version="${GITHUB_REF_NAME#v}"

              echo "${image}:${version}"

              if [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                major_minor="$(echo "${version}" | cut -d. -f1,2)"
                echo "${image}:${major_minor}"
              fi

              if [[ "${version}" != *-* ]]; then
                echo "${image}:latest"
              fi
            else
              branch="${GITHUB_REF_NAME//\//-}"
              echo "${image}:${branch}"
            fi

            echo "${image}:sha-${short_sha}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "labels<<EOF"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.title=IncidentRelay"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          labels: ${{ steps.image.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-publish:
    name: Publish Helm chart to GHCR
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v4.2.3

      - name: Validate release metadata
        id: chart
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          chart_version="$(awk '$1 == "version:" {gsub(/[\"'\'' ]/, "", $2); print $2; exit}' "${CHART_DIR}/Chart.yaml")"
          app_version="$(awk '$1 == "appVersion:" {gsub(/[\"'\'' ]/, "", $2); print $2; exit}' "${CHART_DIR}/Chart.yaml")"

          if [[ ! "${release_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable Helm releases require a vMAJOR.MINOR.PATCH tag, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          if [[ "${chart_version}" != "${release_version}" ]]; then
            echo "Chart version ${chart_version} does not match release tag ${release_version}" >&2
            exit 1
          fi

          if [[ -z "${app_version}" ]]; then
            echo "Chart appVersion is empty" >&2
            exit 1
          fi

          echo "version=${chart_version}" >> "${GITHUB_OUTPUT}"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package "${CHART_DIR}" --destination dist
          test -f "dist/incidentrelay-${{ steps.chart.outputs.version }}.tgz"

      - name: Log in to GHCR with Helm
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login "${REGISTRY}" \
              --username "${GITHUB_ACTOR}" \
              --password-stdin

      - name: Push chart to GHCR
        run: |
          helm push \
            "dist/incidentrelay-${{ steps.chart.outputs.version }}.tgz" \
            "oci://${CHART_REGISTRY}"

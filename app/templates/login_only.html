<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='images/favicon/apple-touch-icon.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='images/favicon/favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='images/favicon/favicon-16x16.png') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon/favicon.ico') }}">
    <link rel="manifest" href="{{ url_for('static', filename='images/favicon/site.webmanifest') }}">
    <meta name="theme-color" content="#0b5cff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncidentRelay - Login</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/oncall.css">
    <link rel="stylesheet" href="/static/css/material.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/vendor/fontawesome/all.min.css') }}">
    <script>
 window.__INCIDENTRELAY_I18N__ = {
  locale: {{ current_locale | tojson }},
  supportedLocales: {{ supported_locales | tojson }},
  messages: {{ i18n_messages | tojson }}
 };
 </script>
 <script src="{{ url_for('static', filename='js/core/i18n.js') }}"></script>

 <script src="/static/js/vendor/jquery-3.7.1.min.js"></script>
    <script src="/static/js/core/api.js"></script>
    <script src="/static/js/core/auth.js"></script>
    <script src="/static/js/pages/login.js"></script>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <div class="login-brand-block">
            <a href="/" class="login-brand-link" title="IncidentRelay">
                <img
                    class="login-brand-logo"
                    src="/static/images/incidentrelay-logo.svg"
                    alt="IncidentRelay"
                >
            </a>
        </div>

        <div class="login-form-wrap">
            <div class="login-badge">Secure operator access</div>

            <h1>Sign in</h1>
            <p class="login-description">
                Manage schedules, acknowledge alerts and coordinate incident response from one place.
            </p>

            <div class="form-group">
  <label for="login-language-select">Language</label>
  <select id="login-language-select" class="input" data-locale-select>
  {% for locale_code, locale_name in supported_locales.items() %}
   <option value="{{ locale_code }}"{% if locale_code == current_locale %} selected{% endif %}>{{ locale_name }}</option>
  {% endfor %}
  </select>
 </div>
 <div id="login-status" class="login-error" style="display:none;"></div>

            <form id="login-form" method="post" action="/api/auth/login">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        id="username"
                        name="username"
                        type="text"
                        placeholder="Enter username"
                        autocomplete="username"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login">Sign in</button>
            </form>
        </div>
        <div id="sso-login-section" class="login-sso-section" style="display: none;">
          <div class="login-divider">
            <span>or continue with SSO</span>
          </div>

          <div id="sso-provider-buttons" class="login-sso-buttons"></div>
        </div>
    </div>
</div>
<script>
$(function () {
    $('#login-form').on('submit', function (e) {
        login();
        e.preventDefault();
    });
});
</script>
</body>
</html>

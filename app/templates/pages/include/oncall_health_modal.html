<div
    class="app-modal"
    id="rotation-health-modal"
    style="display: none;"
    aria-hidden="true"
>
    <div class="app-modal-card app-modal-wide">
        <div class="app-modal-header">
            <div>
                <h2 id="rotation-health-title">{{ _('oncall_health.title.rotation') }}</h2>
                <p id="rotation-health-subtitle" class="muted"></p>
            </div>

            <button
                type="button"
                class="modal-close"
                onclick="closeAppModal('#rotation-health-modal')"
                aria-label="{{ _('oncall_health.close') }}"
            >
                ×
            </button>
        </div>

        <div class="app-modal-body">
            <div
                id="rotation-health-window"
                class="oncall-health-window"
            ></div>

            <div
                id="rotation-health-summary"
                class="oncall-health-summary-grid"
            ></div>

            <div id="rotation-health-issues"></div>
        </div>

        <div class="app-modal-footer">
            <button
                type="button"
                class="btn"
                onclick="closeAppModal('#rotation-health-modal')"
            >
                {{ _('oncall_health.close') }}
            </button>
        </div>
    </div>
</div>

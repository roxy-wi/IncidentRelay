<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title id="offline-title">IncidentRelay offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1570ef">
    <style>
        :root {
            color-scheme: light dark;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            --offline-bg: #f8fafc;
            --offline-surface: #ffffff;
            --offline-border: #e5edf6;
            --offline-text: #101828;
            --offline-muted: #667085;
            --offline-primary: #1570ef;
            --offline-on-primary: #ffffff;
            --offline-shadow: 0 18px 45px rgba(16, 24, 40, 0.08);
            background: var(--offline-bg);
            color: var(--offline-text);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --offline-bg: #0b1220;
                --offline-surface: #111827;
                --offline-border: #334155;
                --offline-text: #e5edf6;
                --offline-muted: #94a3b8;
                --offline-primary: #60a5fa;
                --offline-on-primary: #0b1220;
                --offline-shadow: 0 18px 45px rgba(0, 0, 0, 0.34);
            }
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        main {
            width: min(440px, 100%);
            padding: 28px;
            border: 1px solid var(--offline-border);
            border-radius: 18px;
            background: var(--offline-surface);
            box-shadow: var(--offline-shadow);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 22px;
            line-height: 1.2;
        }

        p {
            margin: 0;
            color: var(--offline-muted);
            line-height: 1.5;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            font-weight: 800;
            color: var(--offline-primary);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--offline-primary);
        }

        button {
            margin-top: 18px;
            min-height: 36px;
            padding: 0 14px;
            border: 0;
            border-radius: 10px;
            background: var(--offline-primary);
            color: var(--offline-on-primary);
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
<main>
    <div class="brand">
        <span class="dot"></span>
        IncidentRelay
    </div>

    <h1 id="offline-heading">You are offline</h1>
    <p id="offline-description">
        IncidentRelay needs a network connection to show current alerts,
        rotations and service impact. Check your connection and try again.
    </p>

    <button id="offline-retry" type="button" onclick="window.location.reload()">
        Retry
    </button>
</main>
<script>
(function () {
    const messages = {
        en: {
            title: "IncidentRelay offline",
            heading: "You are offline",
            description: "IncidentRelay needs a network connection to show current alerts, rotations and service impact. Check your connection and try again.",
            retry: "Retry"
        },
        ru: {
            title: "IncidentRelay — нет подключения",
            heading: "Нет подключения к сети",
            description: "Для отображения актуальных алертов, ротаций и влияния на сервисы IncidentRelay требуется подключение к сети. Проверьте соединение и повторите попытку.",
            retry: "Повторить"
        },
        de: {
            title: "IncidentRelay – offline",
            heading: "Sie sind offline",
            description: "IncidentRelay benötigt eine Netzwerkverbindung, um aktuelle Alarme, Rotationen und Auswirkungen auf Services anzuzeigen. Überprüfen Sie Ihre Verbindung und versuchen Sie es erneut.",
            retry: "Erneut versuchen"
        },
        zh: {
            title: "IncidentRelay 离线",
            heading: "当前处于离线状态",
            description: "IncidentRelay 需要网络连接才能显示最新告警、值班安排和服务影响。请检查网络连接后重试。",
            retry: "重试"
        }
    };

    const cookieMatch = document.cookie.match(
        /(?:^|;\s*)incidentrelay_locale=([^;]+)/
    );
    const cookieLocale = cookieMatch
        ? decodeURIComponent(cookieMatch[1])
        : "";
    const browserLocale = navigator.language || "en";
    const requestedLocale = String(cookieLocale || browserLocale)
        .toLowerCase()
        .replace("_", "-");
    const locale = requestedLocale.startsWith("ru")
        ? "ru"
        : requestedLocale.startsWith("de")
            ? "de"
            : requestedLocale.startsWith("zh")
                ? "zh"
                : "en";
    const selected = messages[locale];

    document.documentElement.lang = locale;
    document.title = selected.title;
    document.getElementById("offline-title").textContent = selected.title;
    document.getElementById("offline-heading").textContent = selected.heading;
    document.getElementById("offline-description").textContent =
        selected.description;
    document.getElementById("offline-retry").textContent = selected.retry;
})();
</script>
</body>
</html>

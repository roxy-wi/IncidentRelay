[mypy]
python_version = 3.10
ignore_missing_imports = True
check_untyped_defs = True
show_error_codes = True
warn_unused_configs = True

# IncidentRelay attaches these attributes to Flask's request proxy in
# middleware/authentication code. Restrict this exception to modules that
# consume those known dynamic attributes instead of disabling attr-defined
# globally.
[mypy-app.middleware,app.services.integrations.auth]
disable_error_code = attr-defined

[mypy-app.views.admin_users_view,app.views.auth_view,app.views.business_services.routes,app.views.calendar_view,app.views.channels_view,app.views.groups_view,app.views.heartbeats_view,app.views.integrations_view,app.views.notification_rules_view,app.views.profile_view,app.views.push_view,app.views.rotations_view,app.views.teams_view,app.views.users_view]
disable_error_code = attr-defined

[main]
secret_key =
timezone = UTC

[server]
host = 0.0.0.0
port = 8080
public_base_url = http://localhost:8080

[database]
# Supported values: sqlite, mysql, postgresql
type = sqlite
name = /var/lib/incidentrelay/incidentrelay.db
user =
password =
host = 127.0.0.1
port = 0

[auth]
api_auth_required = true
rbac_enforced = true
jwt_secret =
jwt_expire_minutes = 1440
jwt_cookie_name = incidentrelay_jwt
jwt_cookie_secure = false

[alerts]
# Processing trace detail: full, compact or disabled. Event Orchestration may override it.
explain_trace_level = full
# How often the reminder scheduler scans unacknowledged alerts.
reminder_interval_seconds = 60
alert_group_window_seconds = 3600
alert_group_wait_seconds = 30
alert_group_interval_seconds = 300
alert_group_notification_check_interval_seconds = 10
silence_lifecycle_check_interval_seconds = 30
alert_group_notification_batch_size = 100

# Deduplicate alerts with the same source and dedup key within this window.
alert_group_window_seconds = 3600

[incidents]
responder_default_expires_after_minutes = 30
responder_expire_check_interval_seconds = 30
responder_expire_batch_size = 100

[retention]
# 0 keeps resolved alert history indefinitely. Explain Trace and general
# orchestration execution retention inherit alert_days when omitted.
alert_days = 0
# explain_trace_days = 30
# orchestration_execution_days = 30
cleanup_interval_seconds = 86400
batch_size = 500

[scheduler]
# Database lock TTL for scheduler jobs.
lock_ttl_seconds = 120
user_notification_rules_check_interval_seconds = 30

[security]
# Private destinations for notification webhooks are denied unless explicitly
# allowlisted here by an operator, e.g. 10.20.0.0/16,192.168.50.10/32.
outbound_private_network_allowlist =
outbound_http_max_redirects = 3
outbound_http_max_response_bytes = 1048576

[mattermost]
# Used to validate Mattermost interactive button callbacks.
action_secret =
api_url = https://mattermost.example.com
bot_token = your-bot-token
bot_user_id =

[smtp]
host =
port = 587
user =
password =
from = incidentrelay@example.com
use_tls = true

[logging]
level = INFO
file = /var/log/incidentrelay/incidentrelay.log
app_file = /var/log/incidentrelay/incidentrelay.log
scheduler_file = /var/log/incidentrelay/incidentrelay-scheduler.log
telegram_worker_file = /var/log/incidentrelay/incidentrelay-telegram-worker.log
slack_worker_file = /var/log/incidentrelay/incidentrelay-slack-worker.log

[voice]
# Default voice provider if channel config does not override it.
provider = stub

# Directory for custom self-hosted voice provider modules.
# This directory contains executable Python code and must be writable only by admin/root.
providers_dir = /usr/local/lib/incidentrelay/voice_providers

# Global fallback secret for voice callbacks.
# Channel config callback_secret has higher priority.
callback_secret = change-me

text_template = IncidentRelay alert {alert_id}. {title}. Severity {severity}. {message}. Press 1 to acknowledge. Press 2 to resolve.
dtmf_actions = {"1": "acknowledge", "2": "resolve"}
callback_secret = test-voice-secret

[voice_provider]
api_url = https://voice.example.com/api
api_token = ${VOICE_API_TOKEN}
timeout = 10

[telegram]
proxy_url =

[oncall]
shift_mattermost_enabled = true
shift_email_check_interval_seconds = 60
shift_email_lookback_seconds = 300

[browser_push]
enabled = true
vapid_public_key = <public key>
vapid_private_key = <private key>
vapid_subject = mailto:admin@example.com
action_token_ttl_seconds = 900

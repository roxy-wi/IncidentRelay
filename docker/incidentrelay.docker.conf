[main]
log_level = INFO
log_file = /var/log/incidentrelay/incidentrelay.log

[server]
host = 0.0.0.0
port = 8080
public_base_url = http://localhost:8080

[database]
type = sqlite
name = /var/lib/incidentrelay/incidentrelay.db

[sqlite]
wal = true
busy_timeout = 5000

[security]
# Comma-separated CIDRs allowed for outbound notification webhooks.
# Private, loopback, link-local and reserved networks are denied by default.
outbound_private_network_allowlist =

[voice]
provider = stub
providers_dir = /usr/local/lib/incidentrelay/voice_providers
callback_secret =

[retention]
# 0 keeps resolved alert history indefinitely. Explain Trace and general
# orchestration execution retention inherit alert_days when omitted.
alert_days = 0
# explain_trace_days = 30
# orchestration_execution_days = 30
cleanup_interval_seconds = 86400
batch_size = 500

[logging]
level = INFO
file = /var/log/incidentrelay/incidentrelay.log
app_file = /var/log/incidentrelay/incidentrelay.log
scheduler_file = /var/log/incidentrelay/incidentrelay-scheduler.log
telegram_worker_file = /var/log/incidentrelay/incidentrelay-telegram-worker.log
slack_worker_file = /var/log/incidentrelay/incidentrelay-slack-worker.log

# Default values for the IncidentRelay chart.

image:
  repository: ghcr.io/roxy-wi/incidentrelay
  # Defaults to the chart appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  # Defaults to the fullname when empty.
  name: ""

# IncidentRelay reads every setting from a single INI file mounted at
# /etc/incidentrelay/incidentrelay.conf. The map below is rendered into
# that file: top-level keys become INI sections, nested keys become options.
# Empty shared security secrets documented below inherit main.secret_key so
# every pod uses stable keys. It is stored as a Secret because it carries credentials
# (secret_key, database password, SMTP password, VAPID keys, ...).
config:
  main:
    # Required unless existingConfigSecret is used. Generate with: openssl rand -hex 32
    secret_key: ""
    # Empty inherits secret_key. Override when you want a separate encryption key.
    secret_encryption_key: ""
    timezone: UTC
  server:
    host: 0.0.0.0
    port: 8080
    public_base_url: http://localhost:8080
  auth:
    # Secure defaults used by the stock 2.0 configuration.
    api_auth_required: true
    rbac_enforced: true
    # Empty inherits main.secret_key in the rendered Helm config, so every pod
    # uses the same JWT signing key. Override with a separate random value if desired.
    jwt_secret: ""
    jwt_expire_minutes: 1440
    jwt_cookie_name: incidentrelay_jwt
    jwt_cookie_secure: false
    login_ip_max_failures: 60
    login_ip_window_seconds: 60
    login_ip_block_seconds: 60
    login_account_max_failures: 20
    login_account_window_seconds: 300
    login_account_block_seconds: 300
  # SQLite works out of the box but requires the shared data volume below;
  # with more than one node, switch to PostgreSQL:
  #   database:
  #     type: postgresql
  #     host: postgres.example.svc
  #     port: 5432
  #     name: incidentrelay
  #     user: incidentrelay
  #     password: <database-password>
  # NB: the SQLite file location option is `name` (not `path` — the app
  # ignores `path`, see Config.DB_NAME in app/settings.py).
  database:
    type: sqlite
    name: /var/lib/incidentrelay/incidentrelay.db
  sqlite:
    wal: true
    busy_timeout: 5000
  security:
    # Private/loopback/link-local outbound notification targets are denied by default.
    # Add only operator-approved CIDRs when internal webhooks are required.
    outbound_private_network_allowlist: ""
    outbound_http_max_redirects: 3
    outbound_http_max_response_bytes: 1048576
  alerts:
    # Processing trace detail: full, compact or disabled. Global Event Orchestration may override it.
    explain_trace_level: full
    reminder_interval_seconds: 60
    alert_group_window_seconds: 3600
    alert_group_wait_seconds: 30
    alert_group_interval_seconds: 300
    alert_group_notification_check_interval_seconds: 10
    alert_group_notification_batch_size: 100
    silence_lifecycle_check_interval_seconds: 30
  incidents:
    responder_default_expires_after_minutes: 30
    responder_expire_check_interval_seconds: 30
    responder_expire_batch_size: 100
  maintenance:
    lifecycle_check_interval_seconds: 30
    lifecycle_batch_size: 500
  retention:
    # 0 keeps resolved alert history indefinitely. Optional trace/execution
    # overrides inherit alert_days when omitted.
    alert_days: 0
    # explain_trace_days: 30
    # orchestration_execution_days: 30
    cleanup_interval_seconds: 86400
    batch_size: 500
  scheduler:
    lock_ttl_seconds: 120
    user_notification_rules_check_interval_seconds: 30
  services:
    impact_snapshot_enabled: true
    impact_snapshot_interval_seconds: 300
    impact_snapshot_retention_days: 365
  logging:
    level: INFO
    file: /var/log/incidentrelay/incidentrelay.log
    scheduler_file: /var/log/incidentrelay/incidentrelay-scheduler.log
    telegram_worker_file: /var/log/incidentrelay/incidentrelay-telegram-worker.log
    slack_worker_file: /var/log/incidentrelay/incidentrelay-slack-worker.log
  mattermost:
    # Empty inherits main.secret_key in the rendered Helm config.
    action_secret: ""
  voice:
    provider: stub
    providers_dir: /usr/local/lib/incidentrelay/voice_providers
    # Empty inherits main.secret_key in the rendered Helm config.
    callback_secret: ""

# Name of an existing Secret holding the full config under the key
# `incidentrelay.conf`. When set, the `config` map above is ignored and
# no Secret is rendered by the chart.
existingConfigSecret: ""

# Persistent storage for /var/lib/incidentrelay (the SQLite database and
# the runtime config generated by the container entrypoint). For chart-rendered
# SQLite configs this must stay enabled. Worker pods are automatically pinned
# to the web pod's node so the ReadWriteOnce volume is mounted consistently.
# SQLite over network-backed ReadWriteMany storage (NFS and friends) is a
# known way to corrupt the database. For anything multi-node switch
# config.database to PostgreSQL and disable persistence.
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  # Empty means the cluster default storage class.
  storageClass: ""
  # Use a pre-existing PVC instead of creating one.
  existingClaim: ""
  annotations: {}

web:
  replicaCount: 1
  # Recreate is the safe default while SQLite lives on the shared PVC:
  # it prevents the old and new pod from writing one database file
  # during a rollout (and a rollout deadlock on RWO volumes). With
  # PostgreSQL feel free to switch to RollingUpdate.
  strategy:
    type: Recreate
  # Run database migrations in the entrypoint before gunicorn starts.
  # Keep replicaCount at 1 while this is on: several pods starting at
  # once would race on the migrations. To scale web, set this to false
  # and run migrations out of band (`python app/migrate.py migrate`).
  runMigrations: true
  port: 8080
  gunicorn:
    workers: 1
    threads: 4
    timeout: 120
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Background worker that evaluates schedules, reminders and escalations.
scheduler:
  enabled: true
  strategy:
    type: Recreate
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Long-polling worker for Telegram callback buttons. Harmless without a
# configured bot (it idles), disable it if you do not use Telegram.
telegram:
  enabled: true
  strategy:
    type: Recreate
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

# Socket Mode worker for Slack interactive buttons. Harmless without a
# configured Slack app (it idles), disable it if you do not use Slack.
slack:
  enabled: true
  strategy:
    type: Recreate
  resources: {}
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []

service:
  type: ClusterIP
  port: 8080
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: incidentrelay.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

podSecurityContext: {}
securityContext: {}

# Extra volumes / mounts added to every component, e.g. custom voice
# provider plugins for /usr/local/lib/incidentrelay/voice_providers.
extraVolumes: []
extraVolumeMounts: []

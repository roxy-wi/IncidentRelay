# Dedicated local regression database; never points at the normal deployment.
[main]
secret_key = isolated-regression-test
timezone = UTC
[database]
type = postgresql
host = 127.0.0.1
port = 55434
name = incidentrelay_test
user = ir_perf_test
password = local-regression-only
[auth]
api_auth_required = true
rbac_enforced = true
jwt_secret = isolated-regression-test
[logging]
file = /tmp/ir-perf-tests/app.log
app_file = /tmp/ir-perf-tests/app.log
scheduler_file = /tmp/ir-perf-tests/scheduler.log

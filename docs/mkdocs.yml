      - Incoming alert sources:
          - Alertmanager: integrations/alertmanager.md
          - Zabbix: integrations/zabbix.md
          - Sentry: integrations/sentry.md
          - Sentry Troubleshooting: integrations/sentry-troubleshooting.md
          - LibreNMS: integrations/librenms.md

site_name: IncidentRelay Docs
site_description: IncidentRelay self-hosted on-call and alert routing service
repo_url: https://github.com/roxy-wi/IncidentRelay

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - fenced_code
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Project README: project-readme.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Docker Installation: getting-started/docker.md
      - RPM Installation: getting-started/rpm-installation.md
      - Manual systemd Installation: getting-started/systemd.md
      - Configuration: getting-started/configuration.md
      - First Login and Setup: getting-started/first-login.md
      - Quickstart Checklist: getting-started/quickstart.md
  - Main Concepts:
      - Overview: concepts/index.md
      - Groups and RBAC: concepts/groups-and-rbac.md
      - Channels: concepts/channels.md
      - Route Intake Tokens: concepts/route-intake-tokens.md
      - Alert Matchers: concepts/matchers.md
      - Reminders and Escalations: concepts/reminders-and-escalations.md
      - Escalation Policies: concepts/escalation-policies.md
  - Incident Management:
      - Overview: incidents/index.md
      - Alerts and Alert Groups: usage/alerts.md
      - Incident Priorities: incidents/priorities.md
      - Incident Responders: incidents/responders.md
      - Notification Center: incidents/notification-center.md
      - Incident Stakeholders: incidents/stakeholders.md
      - Alert Comments: usage/alert-comments.md
      - Silences: usage/silences.md
      - Maintenance Windows: concepts/maintenance-windows.md
  - Services:
      - Overview: services/index.md
      - Service Model: concepts/services.md
      - Service Default Stakeholders: services/default-stakeholders.md
  - Scheduling:
